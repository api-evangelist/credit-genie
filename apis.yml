aid: credit-genie
name: Credit Genie
description: >-
  Credit Genie is a consumer fintech operated by Creditly Corp. (Wilmington, Delaware,
  founded 2019) that runs a mobile-first money app for people living between paychecks.
  Its Cash Boost product advances $10-$150 with no interest and no hard credit check,
  funded against a linked bank account rather than a credit score, while Money Manager
  layers spending tracking, cash-flow prediction and subscription detection on top of that
  same bank connection. A Line of Credit product and AskGenie, an AI financial assistant,
  are in early access. Creditly Corp. is registered with the California DFPI under the
  CCFPL (registration 04-CCFPL-1956127-3514680) and has raised roughly $21M from Fortress
  Investment Group, Khosla Ventures, Sutter Hill Ventures, Tippet Venture Partners and
  Gabriel Investments. Credit Genie is a direct-to-consumer app company: it publishes no
  public API, developer portal, or machine-readable contract of any kind.
